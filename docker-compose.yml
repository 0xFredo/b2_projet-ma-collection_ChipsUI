services:
  # 1. Base de données PostgreSQL
  db:
    image: postgres:latest
    container_name: postgres-chips
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chips_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    # vérification que la db est bien lancée avant de continuer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chips_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # 2. Service Backend FastAPI
  api:
    build: ./api
    container_name: ma_collection_api
    ports:
      - "8000:8000"
    env_file:
      - path: ./api/.env
        required: false
    volumes:
      - ./api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m make_env && python -m db.seed && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  # 3. Service Frontend React (Vite)
  web:
    build: ./web
    container_name: ma_collection_web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

# Volume nommé pour persister les données de PostgreSQL
volumes:
  postgres_data: