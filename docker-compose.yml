services:
  # 1. Service Backend FastAPI
  api:
    build: ./api
    container_name: ma_collection_api
    ports:
      - "8000:8000"
    env_file:
      - path: ./api/.env
        required: false
    volumes:
      - ./api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python -m make_env && python -m db.seed && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  # 2. Service Frontend React (Vite)
  web:
    build: ./web
    container_name: ma_collection_web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
